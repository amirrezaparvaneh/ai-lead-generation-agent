<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کیف پول و بازخورد | نشانه</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>:root{--bg:#f6f8fc;--card:#fff;--ink:#12203a;--mute:#5b6b86;--line:#dce3f0;--blue:#1f3fd8;--gold:#f4b223}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.9 Vazirmatn,sans-serif}.wrap{max-width:940px;margin:auto;padding:36px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:22px;font-weight:800}.sub{color:var(--mute)}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:23px}.balance{display:flex;gap:12px;margin-top:16px}.amount{flex:1;border-radius:12px;background:#e8edff;padding:14px}.amount b{display:block;font-size:25px;color:var(--blue)}label{display:block;margin-top:12px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}button{margin-top:16px;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-weight:700;cursor:pointer}.row{padding:13px 0;border-bottom:1px solid var(--line)}.badge{font-size:12px;background:#e8edff;color:var(--blue);border-radius:99px;padding:2px 9px}#msg{color:#16845c}@media(max-width:700px){.grid{grid-template-columns:1fr}.balance{flex-direction:column}}</style></head><body><main class="wrap"><header><div><div class="brand">نشانه / کیف پول و بازخورد</div><div class="sub">با گزارش باگ یا پیشنهاد مؤثر، اعتبار دریافت کنید.</div></div><a href="/" class="sub">بازگشت</a></header><div class="grid"><section class="card"><h2>کیف پول</h2><div class="balance"><div class="amount"><span class="sub">اعتبار پیام</span><b id="messages">۰</b></div><div class="amount"><span class="sub">اعتبار ریالی</span><b id="rials">۰ ریال</b></div></div><h3>تراکنش‌ها</h3><div id="transactions" class="sub">در حال دریافت…</div></section><section class="card"><h2>ثبت گزارش</h2><p class="sub">پاداش پس از بررسی تیم نشانه به کیف پول شما واریز می‌شود.</p><label>نوع گزارش</label><select id="kind"><option value="bug">گزارش باگ</option><option value="suggestion">پیشنهاد</option></select><label>عنوان</label><input id="title" maxlength="120" placeholder="عنوان کوتاه و دقیق"><label>شرح</label><textarea id="description" rows="6" maxlength="4000" placeholder="مشکل یا پیشنهاد را با جزئیات، و در صورت باگ مراحل تکرار آن بنویسید."></textarea><button id="send">ارسال برای بررسی</button><div id="msg"></div><h3>گزارش‌های من</h3><div id="reports"></div></section></div></main><script>const $=s=>document.querySelector(s);const fa=n=>new Intl.NumberFormat('fa-IR').format(n);const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'خطایی رخ داد.');return d}async function load(){try{const [w,reports]=await Promise.all([api('/api/wallet'),api('/api/reports')]);$('#messages').textContent=fa(w.balance.message_credit);$('#rials').textContent=fa(w.balance.rial_credit)+' ریال';$('#transactions').innerHTML=w.transactions.length?w.transactions.map(t=>`<div class="row">${esc(t.description)}<br><small>+${fa(t.message_credit)} پیام · +${fa(t.rial_credit)} ریال</small></div>`).join(''):'هنوز تراکنشی ندارید.';$('#reports').innerHTML=reports.length?reports.map(r=>`<div class="row"><span class="badge">${r.status==='pending'?'در انتظار بررسی':r.status==='approved'?'تأیید شده':'رد شده'}</span> ${esc(r.title)}${r.admin_note?'<br><small class="sub">'+esc(r.admin_note)+'</small>':''}</div>`).join(''):'گزارشی ثبت نشده است.'}catch(e){$('#msg').textContent=e.message}}$('#send').onclick=async()=>{const title=$('#title').value.trim(),description=$('#description').value.trim();if(title.length<3||description.length<10){$('#msg').textContent='عنوان و شرح کامل را وارد کنید.';return}try{await api('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:$('#kind').value,title,description})});$('#msg').textContent='گزارش شما ثبت شد و پس از بررسی اطلاع‌رسانی می‌شود.';$('#title').value='';$('#description').value='';load()}catch(e){$('#msg').textContent=e.message}};load()</script></body></html>
