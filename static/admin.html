<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق فرمان | نشانه</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"><style>:root{--bg:#0b1020;--panel:#151d33;--line:#293655;--ink:#edf2ff;--mute:#a7b4d1;--blue:#6d8cff;--green:#49d39b;--red:#ff7585;--gold:#f6c453}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#202d5c,transparent 35%),var(--bg);color:var(--ink);font:15px/1.9 Vazirmatn,sans-serif}.shell{max-width:1280px;margin:auto;padding:32px 22px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--gold)}.sub{color:var(--mute)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}.stat,.card{background:rgba(21,29,51,.88);border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat b{font-size:29px;display:block;color:var(--gold)}.card{padding:22px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}button,select,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:8px 15px;cursor:pointer;background:var(--blue);color:#fff;font-weight:700}button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-size:13px}.title{font-weight:700}.desc{max-width:380px;color:var(--mute);white-space:pre-wrap}.badge{padding:2px 10px;border-radius:99px;font-size:12px;background:#28375d}.bug{color:#ffabb4}.suggestion{color:#aabaff}.empty{padding:40px;text-align:center;color:var(--mute)}dialog{width:min(94vw,520px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:24px}dialog::backdrop{background:#000a}label{display:block;margin-top:13px;color:var(--mute)}input,textarea{width:100%;background:#0d1427;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}.actions{display:flex;gap:8px;margin-top:18px}.danger{background:var(--red)}#error{color:#ffabb4}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}.shell{padding:18px}}</style></head><body><main class="shell"><header><div><div class="brand">نشانه <span>/ اتاق فرمان</span></div><div class="sub">مدیریت گزارش‌ها و پاداش کیف پول</div></div><a href="/" class="sub">بازگشت به سایت</a></header><section class="stats" id="stats"></section><section class="card"><div class="toolbar"><h2>گزارش‌ها</h2><div><select id="filter"><option value="pending">در انتظار بررسی</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="all">همه</option></select><button class="ghost" id="refresh">بروزرسانی</button></div></div><div id="error"></div><div id="reports"></div></section></main><dialog id="review"><h3 id="reviewTitle">بررسی گزارش</h3><p id="reviewInfo" class="sub"></p><label>اعتبار پیام</label><input id="messages" type="number" min="0" value="0"><label>اعتبار ریالی</label><input id="rials" type="number" min="0" value="0"><label>یادداشت برای کاربر</label><textarea id="note" rows="3"></textarea><div class="actions"><button id="approve">تأیید و واریز پاداش</button><button id="reject" class="danger">رد گزارش</button><button id="cancel" class="ghost">انصراف</button></div></dialog><script>const $=s=>document.querySelector(s);let selected;const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'دسترسی یا ارتباط ناموفق است.');return d}async function load(){try{const [o,rs]=await Promise.all([api('/api/admin/overview'),api('/api/admin/reports?status='+$('#filter').value)]);$('#stats').innerHTML=[['کاربران',o.users],['در انتظار',o.reports_pending],['تأییدشده',o.reports_approved],['ردشده',o.reports_rejected],['پیام‌های تحلیل‌شده',o.results]].map(x=>`<div class="stat"><span class="sub">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#reports').innerHTML=rs.length?`<table><thead><tr><th>نوع</th><th>گزارش‌دهنده</th><th>موضوع و شرح</th><th>زمان</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td class="${r.kind}">${r.kind==='bug'?'باگ':'پیشنهاد'}</td><td>${esc(r.phone||r.email)}</td><td><div class="title">${esc(r.title)}</div><div class="desc">${esc(r.description)}</div></td><td>${esc(r.created_at)}</td><td>${r.status==='pending'?`<button onclick="openReview(${r.id},'${esc(r.title)}')">بررسی</button>`:`<span class="badge">${r.status==='approved'?'تأیید':'رد'}${r.admin_note?' — '+esc(r.admin_note):''}</span>`}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">گزارشی در این وضعیت نیست.</div>';$('#error').textContent=''}catch(e){$('#error').textContent=e.message}}window.openReview=(id,title)=>{selected=id;$('#reviewTitle').textContent='بررسی: '+title;$('#reviewInfo').textContent='با تأیید، اعتبارها بلافاصله به کیف پول کاربر افزوده می‌شوند.';$('#review').showModal()};async function review(action){try{await api('/api/admin/reports/'+selected+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,message_credit:+$('#messages').value||0,rial_credit:+$('#rials').value||0,note:$('#note').value})});$('#review').close();load()}catch(e){$('#reviewInfo').textContent=e.message}}$('#approve').onclick=()=>review('approve');$('#reject').onclick=()=>review('reject');$('#cancel').onclick=()=>$('#review').close();$('#refresh').onclick=load;$('#filter').onchange=load;load()</script></body></html>
