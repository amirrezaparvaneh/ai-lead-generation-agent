<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق فرمان | نشانه</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;600;700;900&display=swap"><style>:root{--bg:#080d1b;--panel:#121b32;--line:#27375c;--ink:#edf2ff;--mut:#9caed0;--blue:#7190ff;--gold:#ffd166;--red:#fa7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#293b79,transparent 33%),var(--bg);color:var(--ink);font:14px/1.9 'Alan Sans',sans-serif}.shell{max-width:1380px;margin:auto;padding:32px 24px}header,.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:14px}header{margin-bottom:28px}.brand{font-size:23px;font-weight:900}.brand i{color:var(--gold);font-style:normal}.mut{color:var(--mut)}a{color:inherit}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.stat,.card{background:#121b32d9;border:1px solid var(--line);border-radius:18px}.stat{padding:17px}.stat b{display:block;font-size:27px;color:var(--gold)}.card{padding:21px;margin-bottom:18px}h2,h3{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:8px 14px;font-weight:800}.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.danger{background:var(--red)}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--mut);font-size:12px}.tag{font-size:12px;border-radius:99px;padding:2px 9px;background:#263861;color:#b9c8ff}.desc{max-width:350px;white-space:pre-wrap;color:var(--mut)}dialog{width:min(94vw,500px);border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:22px}dialog::backdrop{background:#000b}label{display:block;margin-top:10px;color:var(--mut)}input,textarea{width:100%;padding:9px;background:#0a1123;border:1px solid var(--line);border-radius:9px;color:#fff}.actions{display:flex;gap:8px;margin-top:16px}.tab{display:none}.tab.on{display:block}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button.on{background:var(--gold);color:#17203b}#error{color:#ffadba}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}.shell{padding:18px}}</style></head><body><main class="shell"><header><div><div class="brand">نشانه <i>/ اتاق فرمان</i></div><div class="mut">کاربران، مصرف، اعتبار و بازخوردها در یک نما</div></div><div><a class="mut" href="/">سایت</a> <button class="ghost" id="logout">خروج</button></div></header><div id="login" class="card" style="max-width:420px;margin:80px auto"><h2>ورود مدیر</h2><label>نام کاربری</label><input id="username" value="admin"><label>گذرواژه</label><input id="password" type="password"><button id="loginBtn">ورود به اتاق فرمان</button><div id="loginError"></div></div><div id="app" hidden><section class="stats" id="stats"></section><nav class="nav"><button class="on" data-tab="reports">بازخوردها</button><button data-tab="users">کاربران و اعتبار</button></nav><section id="reports" class="tab on card"><div class="bar"><h2>گزارش‌های کاربران</h2><select id="filter"><option value="pending">در انتظار بررسی</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="all">همه</option></select></div><div id="reportList"></div></section><section id="users" class="tab card"><div class="bar"><h2>کاربران، مصرف و پرداخت</h2><button class="ghost" id="refresh">بروزرسانی</button></div><div id="userList"></div></section><div id="error"></div></div></main><dialog id="modal"><h3 id="modalTitle"></h3><p id="modalInfo" class="mut"></p><label>اعتبار پیام</label><input id="messages" type="number" min="0" value="0"><label>اعتبار ریالی</label><input id="rials" type="number" min="0" value="0"><label>یادداشت</label><textarea id="note" rows="3"></textarea><div class="actions"><button id="approve">ثبت اعتبار / تأیید</button><button id="reject" class="danger">رد گزارش</button><button id="cancel" class="ghost">انصراف</button></div></dialog><script>const $=s=>document.querySelector(s),fa=n=>new Intl.NumberFormat('fa-IR').format(n||0);let selected,type;const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(u,o){const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'ارتباط ناموفق است.');return d}async function load(){try{const[o,rs,us]=await Promise.all([api('/api/admin/overview'),api('/api/admin/reports?status='+$('#filter').value),api('/api/admin/users')]);$('#stats').innerHTML=[['کاربران',o.users],['در انتظار',o.reports_pending],['تأیید',o.reports_approved],['رد',o.reports_rejected],['تحلیل‌ها',o.results]].map(x=>`<div class="stat"><span class="mut">${x[0]}</span><b>${fa(x[1])}</b></div>`).join('');$('#reportList').innerHTML=`<table><thead><tr><th>نوع</th><th>کاربر</th><th>شرح</th><th></th></tr></thead><tbody>${rs.map(r=>`<tr><td><span class="tag">${r.kind==='bug'?'باگ':'پیشنهاد'}</span></td><td>${esc(r.phone||r.email)}</td><td><b>${esc(r.title)}</b><div class="desc">${esc(r.description)}</div></td><td>${r.status==='pending'?`<button onclick="report(${r.id},'${esc(r.title)}')">بررسی</button>`:`<span class="mut">${r.status==='approved'?'تأیید':'رد'}</span>`}</td></tr>`).join('')}</tbody></table>`;$('#userList').innerHTML=`<table><thead><tr><th>کاربر</th><th>نوع اکانت</th><th>مصرف</th><th>هزینه AI</th><th>اعتبار پیام</th><th>اعتبار ریالی</th><th>پرداختی/واریزی</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.phone||u.email)}</td><td><span class="tag">رایگان</span></td><td>${fa(u.messages)} پیام</td><td>$${(+u.usage_cost).toFixed(4)}</td><td>${fa(u.message_credit)}</td><td>${fa(u.rial_credit)} ریال</td><td>${fa(u.payments)} ریال</td><td><button onclick="credit(${u.id},'${esc(u.phone||u.email)}')">افزودن اعتبار</button></td></tr>`).join('')}</tbody></table>`;$('#error').textContent=''}catch(e){if(e.message.includes('admin login')){$('#app').hidden=true;$('#login').hidden=false}else $('#error').textContent=e.message}}window.report=(id,title)=>{selected=id;type='report';$('#modalTitle').textContent='بررسی: '+title;$('#reject').hidden=false;$('#modal').showModal()};window.credit=(id,name)=>{selected=id;type='user';$('#modalTitle').textContent='افزودن اعتبار: '+name;$('#reject').hidden=true;$('#modal').showModal()};async function submit(action){try{let u=type==='report'?'/api/admin/reports/'+selected+'/review':'/api/admin/users/'+selected+'/credit',body={message_credit:+$('#messages').value||0,rial_credit:+$('#rials').value||0,note:$('#note').value};if(type==='report')body.action=action;await api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#modal').close();load()}catch(e){$('#modalInfo').textContent=e.message}}$('#approve').onclick=()=>submit('approve');$('#reject').onclick=()=>submit('reject');$('#cancel').onclick=()=>$('#modal').close();$('#filter').onchange=load;$('#refresh').onclick=load;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.tab).classList.add('on')});$('#loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});$('#login').hidden=true;$('#app').hidden=false;load()}catch(e){$('#loginError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};load()</script></body></html>
